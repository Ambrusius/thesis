# Overlap removal
#
# DR calculated either in (y,phi) or (eta,phi)-space
# specified by RapidityPhi or EtaPhi
OverlapRemoval.MatchingMode:               RapidityPhi

# DR should always be positive
#  Electron_StacoMu_DR: 0.02 means that electrons within DR<0.02 of Staco Muons are removed
OverlapRemoval.HZG.StacoMu_StacoMu_DR:     0.0
OverlapRemoval.HZG.Electron_Electron_DEta: 0.075
OverlapRemoval.HZG.Electron_Electron_DPhi: 0.125

OverlapRemoval.HZG.Electron_StacoMu_DR:    0.02
OverlapRemoval.HZG.CaloMu_StacoMu_DR:      0.1
OverlapRemoval.HZG.CaloMu_Electron_DR:     0.2
OverlapRemoval.HZG.Photon_Electron_DR:     0.3
OverlapRemoval.HZG.Photon_CaloMu_DR:       0.3
OverlapRemoval.HZG.Photon_StacoMu_DR:      0.3
OverlapRemoval.HZG.Jet_Photon_DR:          0.2
OverlapRemoval.HZG.Jet_StacoMu_DR:         0.2
OverlapRemoval.HZG.Jet_CaloMu_DR:          0.2
OverlapRemoval.HZG.Jet_Electron_DR:        0.2

# Final cuts (used for cutflow histogram and to fill variable EventInfo.cutflow)
# They are applied in this order:
# FinalMinMllCut && FinalMaxMllCut
# LoosePhotonPtCut
# Tight ID
# Isolation
# FinalMinMllgCut && FinalMaxMllgCut
# FinalPhotonPtCut
# LoosePhotonPtCut, FinalPhotonPtCut: if < 0.0, no cut; if < 1.0, it will be interpreted as a relative cut on pT/m(llg); if >1, it will be interpreted as an absolute cut in GeV
#H2ZyAnalysis.FinalMinMllCut:           76.18
#H2ZyAnalysis.FinalMaxMllCut:           106.18
H2ZyAnalysis.FinalMinMllCut:           81.18
H2ZyAnalysis.FinalMaxMllCut:           101.18
#H2ZyAnalysis.LoosePhotonPtCut:         15.0
H2ZyAnalysis.LoosePhotonPtCut:         0.12
#H2ZyAnalysis.FinalPhotonIsolationCut:  FixedCutTightCaloOnly
H2ZyAnalysis.FinalPhotonIsolationCut:  FixedCutLoose
##H2ZyAnalysis.FinalPhotonIDCut:        Medium
H2ZyAnalysis.FinalPhotonIDCut:         Tight
#H2ZyAnalysis.FinalPhotonPtCut:         0.2
H2ZyAnalysis.FinalPhotonPtCut:         0.12
#H2ZyAnalysis.FinalMinMllgCut:          200.0
H2ZyAnalysis.FinalMinMllgCut:          115.0
H2ZyAnalysis.FinalMaxMllgCut:          170.0

